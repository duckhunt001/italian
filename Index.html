<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italian flashcards</title>
<style>
:root{--bg:#f6f4ee;--fg:#1d2a22;--mut:#66705f;--card:#fff;--line:#d9d5c8;--green:#2f6b4a;--red:#b8412f;--amber:#a8741a;--blue:#2b5f8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--fg:#eae8df;--mut:#9aa392;--card:#1e2721;--line:#33403a;--green:#6fc08f;--red:#e87a66;--amber:#e0b155;--blue:#7db4e0}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:18px/1.45 Georgia,'Times New Roman',serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;color:var(--mut);font:14px system-ui,sans-serif}
.card{flex:1;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:auto}
.q{font-size:24px}.a{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);color:var(--green);font-size:20px}
.en{color:var(--mut);font:italic 16px/1.4 Georgia,serif;margin-top:8px}.a .en{margin-top:8px}
.hint{color:var(--mut);font:14px system-ui,sans-serif;margin-top:16px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:600 15px system-ui,sans-serif;border:0;border-radius:10px;padding:14px 4px;color:#fff;cursor:pointer}
button small{display:block;font-weight:400;opacity:.85;margin-top:2px}
.show{width:100%;background:var(--fg);color:var(--bg);font-size:17px}
.b1{background:var(--red)}.b2{background:var(--amber)}.b3{background:var(--green)}.b4{background:var(--blue)}
.link{background:none;color:var(--mut);font-weight:400;text-decoration:underline;padding:12px}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style></head><body>
<div class="top"><span id="stats"></span><span>Italian: geography and culture</span></div>
<div class="card" id="card"></div>
<div id="ctl"></div>
<div style="text-align:center"><button class="link" id="reset">Reset all progress</button></div>
<script>
const C=[["Quante regioni ci sono in Italia?", "Venti.", "How many regions are there in Italy?", "Twenty."], ["Qual è la capitale d'Italia?", "Roma.", "What is the capital of Italy?", "Rome."], ["Quali paesi europei circondano l'Italia?", "Francia (ovest), Svizzera (nord), Austria (nord) e Slovenia (est).", "Which European countries surround Italy?", "France (west), Switzerland (north), Austria (north), and Slovenia (east)."], ["Quali sono i cinque mari che circondano l'Italia?", "Mar Ligure (nord-ovest), Mar Tirreno (ovest), Mar Adriatico (est), Mar Ionio (sud), Mar Mediterraneo (sud).", "What are the five seas that surround Italy?", "Ligurian Sea (northwest), Tyrrhenian Sea (west), Adriatic Sea (east), Ionian Sea (south), Mediterranean Sea (south)."], ["Quali sono le due grandi isole italiane?", "Sardegna e Sicilia.", "What are the two large Italian islands?", "Sardinia and Sicily."], ["Quali sono le due catene di montagne in Italia e dove si trovano?", "Le Alpi (nord) e gli Appennini (vanno dal nord al sud).", "What are the two mountain ranges in Italy and where are they?", "The Alps (north) and the Apennines (they run from north to south)."], ["Qual è il fiume più lungo d'Italia e in quale regione si trova?", "Il Po (Piemonte).", "What is the longest river in Italy and in which region is it?", "The Po (Piedmont)."], ["Quali altri fiumi importanti ci sono in Italia?", "L'Adige (Trentino e Veneto), il Tevere (Roma) e l'Arno (Toscana).", "What other important rivers are there in Italy?", "The Adige (Trentino and Veneto), the Tiber (Rome), and the Arno (Tuscany)."], ["Quali sono i tre laghi principali?", "Lago di Como, Lago Maggiore e Lago di Garda.", "What are the three main lakes?", "Lake Como, Lake Maggiore, and Lake Garda."], ["Quali sono i due vulcani ancora attivi e in quali regioni si trovano?", "Il Vesuvio (Campania) e l'Etna (Sicilia).", "What are the two volcanoes that are still active and in which regions are they?", "Vesuvius (Campania) and Etna (Sicily)."], ["Com'è il nord d'Italia?", "Industriale.", "What is the north of Italy like?", "Industrial."], ["Com'è il sud d'Italia?", "Agricolo.", "What is the south of Italy like?", "Agricultural."], ["Per che cosa è famosa Venezia?", "Per il vetro e il merletto, per i canali e perché non ci sono macchine.", "What is Venice famous for?", "Glass and lace, the canals, and because there are no cars."], ["Per che cosa è famosa Milano?", "Per la moda (capitale della moda).", "What is Milan famous for?", "Fashion (the fashion capital)."], ["Per che cosa è famosa Bologna?", "Per il cibo (capitale del cibo).", "What is Bologna famous for?", "Food (the food capital)."], ["Per che cosa è famosa Firenze?", "Per l'arte (capitale dell'arte).", "What is Florence famous for?", "Art (the art capital)."], ["Per che cosa è conosciuta Torino?", "Per l'automobile (capitale dell'automobile).", "What is Turin known for?", "Automobiles (the automobile capital)."], ["Per che cosa è famosa Perugia?", "Per la cioccolata (capitale della cioccolata).", "What is Perugia famous for?", "Chocolate (the chocolate capital)."], ["Dove è nato Cristoforo Colombo?", "A Genova.", "Where was Christopher Columbus born?", "In Genoa."], ["Dove si trova il papa?", "Al Vaticano.", "Where is the pope?", "At the Vatican."], ["Qual è un altro nome per Roma?", "La Città Eterna.", "What is another name for Rome?", "The Eternal City."], ["Dove si trova la statua di Davide e chi l'ha fatta?", "A Firenze, nell'Accademia. L'ha fatta Michelangelo.", "Where is the statue of David and who made it?", "In Florence, in the Accademia. Michelangelo made it."], ["Quali sono i due stati indipendenti all'interno dell'Italia?", "Il Vaticano e la Repubblica di San Marino.", "What are the two independent states inside Italy?", "The Vatican and the Republic of San Marino."], ["Quali sono le cose che si trovano a Roma?", "Il Colosseo, la Fontana di Trevi, la Basilica di San Pietro, Piazza di Spagna, il Foro Romano, la Cappella Sistina, il Pantheon e Castel Sant'Angelo.", "What are the things found in Rome?", "The Colosseum, the Trevi Fountain, St. Peter's Basilica, the Spanish Steps, the Roman Forum, the Sistine Chapel, the Pantheon, and Castel Sant'Angelo."]];
const K='it-srs-v1',MIN=6e4,DAY=864e5;
let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
C.forEach((c,i)=>{if(!S[i])S[i]={due:0,ivl:0,n:0}});
const $=id=>document.getElementById(id);
let cur=null,shown=false;
function fmt(ms){return ms<MIN*60?Math.max(1,Math.round(ms/MIN))+' min':ms<DAY?Math.round(ms/36e5)+' h':Math.round(ms/DAY)+' d'}
function next(r){const s=S[cur],i=s.ivl;
 if(r==1)return{ivl:0,wait:MIN};
 if(r==2)return{ivl:i?i*1.2:0,wait:i?i*1.2*DAY:6*MIN};
 if(r==3)return{ivl:i?i*2.5:1,wait:(i?i*2.5:1)*DAY};
 return{ivl:i?i*4:3,wait:(i?i*4:3)*DAY}}
function pick(){const now=Date.now();
 const due=Object.keys(S).filter(k=>S[k].due<=now).sort((a,b)=>S[a].due-S[b].due);
 return due.length?due[0]:null}
function stats(){const now=Date.now(),v=Object.values(S);
 $('stats').textContent=v.filter(s=>s.n==0).length+' new · '+v.filter(s=>s.n>0&&s.due<=now).length+' to review'}
function render(){stats();cur=pick();shown=false;
 if(cur===null){const up=Math.min(...Object.values(S).map(s=>s.due))-Date.now();
  $('card').innerHTML='<div class="q">All done for now!</div><div class="hint">Next card in '+fmt(Math.max(up,MIN))+'. Come back later.</div>';$('ctl').innerHTML='';return}
 $('card').innerHTML='<div class="q">'+C[cur][0]+'</div><div class="hint">Answer with an incomplete sentence in Italian, then flip the card.</div>';
 $('ctl').innerHTML='<button class="show" id="sh">Show answer</button>';$('sh').onclick=reveal}
function reveal(){shown=true;
 $('card').innerHTML='<div class="q">'+C[cur][0]+'</div><div class="en">'+C[cur][2]+'</div><div class="a">'+C[cur][1]+'<div class="en">'+C[cur][3]+'</div></div>';
 const L=['Again','Hard','Good','Easy'];
 $('ctl').innerHTML='<div class="row">'+[1,2,3,4].map(r=>'<button class="b'+r+'" data-r="'+r+'">'+L[r-1]+'<small>'+fmt(next(r).wait)+'</small></button>').join('')+'</div>';
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r))}
function rate(r){const n=next(r),s=S[cur];s.ivl=n.ivl;s.due=Date.now()+n.wait;s.n++;save();render()}
$('reset').onclick=()=>{if(confirm('Delete all progress?')){S={};C.forEach((c,i)=>S[i]={due:0,ivl:0,n:0});save();render()}};
render();
</script></body></html>
